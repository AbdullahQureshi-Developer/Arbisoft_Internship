[project]
name = "clibot"
version = "0.1.0"
description = "CLI chat app powered by OpenRouter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "rich>=13.9.0",
]

[project.scripts]
clibot = "clibot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clibot"]
