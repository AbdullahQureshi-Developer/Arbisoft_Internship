[project]
name = "clibot"
version = "0.1.0"
description = "CLI chat app powered by OpenRouter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "rich>=13.9.0",
    "langchain-core>=0.3.0",
    "langchain-ollama>=0.2.0",
]

[project.scripts]
clibot = "clibot.cli:main"
clibot-compare = "clibot.compare:main"
clibot-ollama = "clibot.ollama_chat:main"

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.15.0",
    "pytest>=8.3.0",
    "pre-commit>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clibot"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
