[project]
name = "research_agent"
version = "0.1.0"
description = "Research agent with web search, memory, file-read, and logging hooks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.9.0",
    "langchain-core>=0.3.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "serpapi>=0.1.0",
    "pypdf>=5.1.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.0",
    "langgraph>=1.2.8",
    "streamlit>=1.38.0",
]

[project.scripts]
agent-demo = "research_agent.demo:main"
agent-ui = "research_agent.app:main"

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.15.0",
    "pytest>=8.3.0",
    "pre-commit>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_agent"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
